name: Build ALL
run-name: Build ALL
on:
  workflow_dispatch: { }
  release:
    types: [ published ]

jobs:
  #Android
  Build_Android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - name: Decode and install certificate
        env:
          STORE_FILE: ${{ secrets.ANDROID_KEYSTORE }}
          PROPERTY_FILE: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$STORE_FILE" | base64 --decode > android/app/keystore.jks
          echo "$PROPERTY_FILE" > android/key.properties
      - uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'
      - name: Check rust-toolchain.toml
        run: rustup show
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: build/app/outputs/apk/release

  #windows
  Build_Windows:
    runs-on: "windows-latest"
    permissions: write-all

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Get tag name and set as environment variable # 添加此步骤以获取 tag
        run: |
          $tag = "${{ github.ref }}".Replace('refs/tags/', '')
          echo "tag=$(echo $tag)" >> $env:GITHUB_ENV

      - run: echo "Kostori-windows-${{ env.tag }}.zip build progress" # 更新这里的输出信息
      - run: choco install yq
      - name: Enable Git longpaths
        run: git config --system core.longpaths true
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '18'
      - run: flutter pub get
      - run: flutter build windows

      - name: Compress and Rename Windows Zip
        run: Compress-Archive build/windows/x64/runner/Release/* Kostori-windows-${{ env.tag }}.zip

      - name: Upload windows zip outputs
        uses: actions/upload-artifact@v4
        with:
          name: Kostori_windows_zip
          path: |
            Kostori-windows-*.zip

      # Build MSIX
      - name: Build msix
        run: dart run msix:create

      - name: Move and Rename Windows MSIX
        run: mv build/windows/x64/runner/Release/kostori.msix Kostori-windows-${{ env.tag }}.msix

      - name: Upload windows msix outputs
        uses: actions/upload-artifact@v4
        with:
          name: Kostori_windows_msix
          path: |
            Kostori-windows-*.msix

  #linux
  # ubuntu-24.04-arm 仅公开仓库免费，私有库需自建 runner（vars.LINUX_ARM64_RUNNER）
  Build_Linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            flutter_arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            flutter_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Get tag name and set as environment variable
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjson-glib-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libmpv-dev libsecret-1-dev libepoxy-dev libglu1-mesa \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libglvnd-dev libxkbcommon-dev libxdamage-dev \
            dpkg-dev

      - name: Enable Git longpaths
        run: git config --system core.longpaths true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: ${{ matrix.flutter_arch }}

      # rhttp / super_native_extensions / dtorrent_task_v2 是 Rust 原生依赖
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check rust-toolchain.toml
        run: rustup show

      - run: flutter pub get

      - name: Build ${{ matrix.arch }}
        run: flutter build linux --release --target-platform linux-${{ matrix.flutter_arch }}

      - name: Package Linux outputs
        run: |
          NAME="Kostori_linux_${TAG}_${{ matrix.arch }}"
          BUNDLE="build/linux/${{ matrix.flutter_arch }}/release/bundle"

          tar -czf "${NAME}.tar.gz" -C "$BUNDLE" .

          rm -rf "pkg_${NAME}"
          mkdir -p "pkg_${NAME}/opt/kostori"
          mkdir -p "pkg_${NAME}/usr/share/applications"
          mkdir -p "pkg_${NAME}/usr/share/icons/hicolor/512x512/apps"
          cp -r "$BUNDLE"/. "pkg_${NAME}/opt/kostori/"
          cp -r assets/linux/DEBIAN "pkg_${NAME}/"
          chmod 0755 "pkg_${NAME}/DEBIAN/postinst" "pkg_${NAME}/DEBIAN/postrm"
          cp assets/linux/com.axlmly.kostori.desktop "pkg_${NAME}/usr/share/applications/"
          cp assets/linux/logo_linux.png \
            "pkg_${NAME}/usr/share/icons/hicolor/512x512/apps/com.axlmly.kostori.png"

          cat > "pkg_${NAME}/DEBIAN/control" <<EOF
          Package: kostori
          Version: ${TAG}
          Section: x11
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Homepage: https://github.com/kostori-app/kostori
          Installed-Size: $(du -sk "pkg_${NAME}/opt" | cut -f1)
          Description: An anime streaming app.
           Supports browsing, watching and downloading anime, with a built-in
           headless service for remote control and LAN playback.
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0, libmpv2, libasound2t64, libsecret-1-0
          EOF

          # dpkg-deb 输出 pkg_<NAME>.deb，需改名才能被 glob 匹配到
          dpkg-deb --build --root-owner-group "pkg_${NAME}"
          mv "pkg_${NAME}.deb" "${NAME}.deb"
          rm -rf "pkg_${NAME}"
          sha256sum "${NAME}.tar.gz" "${NAME}.deb" > "${NAME}.sha256"
          cat "${NAME}.sha256"

      - name: Upload Linux outputs
        uses: actions/upload-artifact@v4
        with:
          name: Kostori_linux_${{ matrix.arch }}
          path: Kostori_linux_*.tar.gz*
            Kostori_linux_*.deb*

  Release:
    runs-on: ubuntu-22.04
    needs: [ Build_Android, Build_Windows, Build_Linux ]
    if: github.event_name == 'release'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: outputs

      - name: Download Windows Zip
        uses: actions/download-artifact@v4
        with:
          name: Kostori_windows_zip
          path: outputs

      - name: Download Windows MSIX
        uses: actions/download-artifact@v4
        with:
          name: Kostori_windows_msix
          path: outputs

      - name: Download Linux amd64
        uses: actions/download-artifact@v4
        with:
          name: Kostori_linux_amd64
          path: outputs

      - name: Download Linux arm64
        uses: actions/download-artifact@v4
        with:
          name: Kostori_linux_arm64
          path: outputs

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            outputs/*.apk
            outputs/Kostori-windows-*.zip
            outputs/Kostori-windows-*.msix
            outputs/Kostori_linux_*.tar.gz
            outputs/Kostori_linux_*.deb
            outputs/Kostori_linux_*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_GITHUB_TOKEN }}
