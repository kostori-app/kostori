plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 3]


// Flutter 把插件注册器生成到 src/main/java 下，只有 `flutter build`
// （releaseMode=true）会剔除 dev_dependency；`flutter test` 与 debug 构建会把
// integration_test 也写进去。之后若直接执行 `gradlew :app:packageRelease`
//（不经过 flutter），这份陈旧文件会被编进主源码集，而 release 的 classpath 里
// 没有 dev_dependency → "程序包 dev.flutter.plugins.integration_test 不存在"。
// 正常路径是 `flutter build apk --release`；这里再兜一层，让误用 gradle 也能过。
def registrantFile = file("src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java")
tasks.register("sanitizePluginRegistrant") {
    def target = registrantFile
    inputs.file(target).optional().withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.upToDateWhen { false }
    doLast {
        if (!target.exists()) return
        def text = target.getText("UTF-8")
        if (!text.contains("integration_test")) return
        def cleaned = text.replaceAll(/(?m)^.*integration_test.*\R/, "")
        target.write(cleaned, "UTF-8")
        logger.lifecycle("sanitizePluginRegistrant: 已从生成的插件注册器中移除 integration_test（dev_dependency，不进 release）")
    }
}
tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn("sanitizePluginRegistrant")
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    namespace = 'com.axlmly.kostori'
    compileSdk = 37
    ndkVersion "28.2.13676358"

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    splits {
        abi {
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            enable true
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        debug {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId = "com.axlmly.kostori"

        minSdk = flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
            signingConfig signingConfigs.release
        }
        debug {
            // 与 release 应用 id 区分，可共存安装
            applicationIdSuffix ".debug"
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
            signingConfig signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (variant.buildType.name == "release") {
                if (abi != null) {
                    outputFileName = "Kostori-${variant.versionName}-${abi}.apk"
                    def abiVersionCode = project.ext.abiCodes.get(abi)
                    if (abiVersionCode != null) {
                        versionCodeOverride = variant.versionCode * 10 + abiVersionCode
                    }
                } else {
                    outputFileName = "Kostori-${variant.versionName}.apk"
                    versionCodeOverride = variant.versionCode * 10
                }
            } else if (variant.buildType.name == "debug") {
                versionCodeOverride = variant.versionCode * 10 + 4
            }
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
