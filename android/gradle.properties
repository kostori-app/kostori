# release 打包（packageRelease）要把多 ABI 的 native 库 + 混淆后的 dex
# 一起写进 zip，4G 堆会 OOM。之前 OOM 后因 -XX:+HeapDumpOnOutOfMemoryError
# 在 android/ 下堆了 8GB 的 .hprof，把 D 盘写到只剩 4GB，APK 打包阶段
# （PackageAndroidArtifact）随后必然失败 —— 这两个都去掉。
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G
kotlin.daemon.jvmargs=-Xmx3G
android.useAndroidX=true
android.enableJetifier=true
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
